[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "roxcal"
dynamic = ["version"]
description = "Unified CLI for Google Calendar, Outlook and CalDAV calendars."
authors = [{name = "Anders Roxell", email = "anders.roxell@gmail.com"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
    "msal>=1.20",
    "requests>=2.28",
    "caldav>=1.3",
    "icalendar>=5.0",
    "python-dateutil>=2.8",
]

[project.scripts]
roxcal = "roxcal.cli:main"

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "black>=24.0",
    "flake8>=7.0",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
exclude = ["\\.venv/"]
