name: ci

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Stockholm
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v3
      - name: install vim and tuxpkg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends vim
          uv tool install tuxpkg
      - name: lint
        run: uv run make
      - name: tests
        run: uv run make test

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build deb
        run: |
          docker run --rm -v "$PWD:/work" -w /work debian:trixie bash -ec '
            apt-get update -q
            apt-get install -y --no-install-recommends \
              build-essential debhelper dh-python python3-all python3-flit-core \
              python3-pip git make ca-certificates
            pip install --break-system-packages tuxpkg
            make deb
          '
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build rpm
        run: |
          docker run --rm -v "$PWD:/work" -w /work fedora:latest bash -ec '
            dnf install -y python3-pip git make rpm-build
            dnf builddep -y *.spec
            pip install tuxpkg
            make rpm
          '
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  pkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build pkg
        run: |
          docker run --rm -v "$PWD:/work" -w /work archlinux:base-devel bash -ec '
            pacman -Syu --noconfirm git make python python-pip
            pip install --break-system-packages tuxpkg
            useradd -m build
            chown -R build:build .
            su build -c "git config --global --add safe.directory $PWD; make pkg"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: dist/*.pkg.tar.zst

  pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, deb, rpm, pkg]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/roxcal
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: build sdist + wheel
        run: |
          pip install flit
          flit build
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, deb, rpm, pkg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: rpm
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: pkg
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
